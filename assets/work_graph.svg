<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#34d399;#38bdf8" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#34d399;#38bdf8;#818cf8;#c084fc" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#c084fc;#34d399" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barWeb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barSystems" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="barMecha" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="barMobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Shimmer Pass -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .header-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .header-title {
      font-size: 20px;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .stat-pct {
      font-size: 12px;
      font-weight: 700;
      fill: #94a3b8;
    }
    .metric-value {
      font-size: 24px;
      font-weight: 800;
      fill: #ffffff;
    }
    .metric-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .pulse-green {
      animation: pulseGreen 2s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    @keyframes barFill {
      from { width: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="6" y="6" width="838" height="368" rx="16" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="838" height="368" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="6" y="6" width="838" height="368" rx="16" fill="url(#shimmer)" />

  <!-- Window Controls -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
  </g>

  <!-- Header Text -->
  <g transform="translate(32, 60)">
    <text class="mono header-tag" x="0" y="0">&gt; GET_SHIT_DONE // WORK DISTRIBUTION &amp; ENGINEERING DOMAINS</text>
    <text class="sans header-title" x="0" y="24">Production Impact &amp; Engineering Focus</text>
  </g>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="pulse-green" />
    <text class="mono" x="28" y="17" font-size="11" font-weight="700" fill="#34d399">ACTIVE PIPELINE</text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="105" x2="818" y2="105" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- LEFT COLUMN: Domain Distribution Bars -->
  <g transform="translate(32, 130)">
    <!-- Domain 1: Full-Stack Web -->
    <g transform="translate(0, 0)">
      <text class="sans stat-label" x="0" y="0">🌐 Modern Web &amp; Distributed Frontends</text>
      <text class="mono stat-pct" x="480" y="0" text-anchor="end">95%</text>
      <rect x="0" y="10" width="480" height="10" rx="5" fill="#1e293b" />
      <rect x="0" y="10" width="456" height="10" rx="5" fill="url(#barWeb)" filter="url(#glow)" />
    </g>

    <!-- Domain 2: Systems & C -->
    <g transform="translate(0, 44)">
      <text class="sans stat-label" x="0" y="0">⚡ Low-Level Systems, Memory Safety &amp; Bare-Metal C</text>
      <text class="mono stat-pct" x="480" y="0" text-anchor="end">92%</text>
      <rect x="0" y="10" width="480" height="10" rx="5" fill="#1e293b" />
      <rect x="0" y="10" width="441" height="10" rx="5" fill="url(#barSystems)" filter="url(#glow)" />
    </g>

    <!-- Domain 3: Mechatronics & Hardware -->
    <g transform="translate(0, 88)">
      <text class="sans stat-label" x="0" y="0">🤖 Mechatronics, Sensors, Actuators &amp; SPICE Circuits</text>
      <text class="mono stat-pct" x="480" y="0" text-anchor="end">90%</text>
      <rect x="0" y="10" width="480" height="10" rx="5" fill="#1e293b" />
      <rect x="0" y="10" width="432" height="10" rx="5" fill="url(#barMecha)" filter="url(#glow)" />
    </g>

    <!-- Domain 4: AI & Scientific Simulation -->
    <g transform="translate(0, 132)">
      <text class="sans stat-label" x="0" y="0">🧠 Applied AI Agents, Gemini API &amp; Space Astrodynamics</text>
      <text class="mono stat-pct" x="480" y="0" text-anchor="end">88%</text>
      <rect x="0" y="10" width="480" height="10" rx="5" fill="#1e293b" />
      <rect x="0" y="10" width="422" height="10" rx="5" fill="url(#barAI)" filter="url(#glow)" />
    </g>

    <!-- Domain 5: Mobile Apps -->
    <g transform="translate(0, 176)">
      <text class="sans stat-label" x="0" y="0">📱 Native Android, Jetpack Compose &amp; Academic Tools</text>
      <text class="mono stat-pct" x="480" y="0" text-anchor="end">85%</text>
      <rect x="0" y="10" width="480" height="10" rx="5" fill="#1e293b" />
      <rect x="0" y="10" width="408" height="10" rx="5" fill="url(#barMobile)" filter="url(#glow)" />
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="550" y1="125" x2="550" y2="335" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- RIGHT COLUMN: GSD Metrics Cards -->
  <g transform="translate(580, 130)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="238" height="85" rx="10" fill="#131b2e" stroke="#25334e" stroke-width="1" />
      <text class="mono metric-value" x="20" y="38" fill="#38bdf8">6+ LIVE</text>
      <text class="sans metric-label" x="20" y="60">Shipped Web &amp; Mobile Apps</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="238" height="85" rx="10" fill="#131b2e" stroke="#25334e" stroke-width="1" />
      <text class="mono metric-value" x="20" y="38" fill="#34d399">0 LEAKS</text>
      <text class="sans metric-label" x="20" y="60">Valgrind Clean Architecture</text>
    </g>
  </g>

  <!-- Bottom Footer Bar -->
  <g transform="translate(32, 354)">
    <text class="mono" font-size="10.5" fill="#64748b">
      CORE MANTRA: <tspan fill="#38bdf8">SPEC FIRST</tspan> &bull; <tspan fill="#818cf8">BUILD LEAN</tspan> &bull; <tspan fill="#34d399">SHIP RELIABLY</tspan> &bull; <tspan fill="#c084fc">GET SHIT DONE</tspan>
    </text>
  </g>
</svg>
